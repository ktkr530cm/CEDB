<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" href="/favicon.ico">
    <!-- PWAやスマホ・デスクトップ追加用 -->
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臨床工学科データベース</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- タブバー -->
    <div id="tab-bar" class="tab-bar">
        <button id="tab-btn-main-page" class="tab-item active">ホーム</button>
    </div>

    <!-- メインコンテナ -->
    <div class="container" id="main-container">
        
        <!-- メインページ (ホーム画面) -->
        <div id="main-page" class="page active">
            
            <!-- メインメニューボタン群 -->
            <div class="main-btn-group">
                <button type="button" class="btn">連絡事項</button>
                <button type="button" class="btn">機器台帳</button>
                <button type="button" class="btn">不具合対応</button>
                <button type="button" class="btn">物品購入</button>
                <button type="button" class="btn">臨床実績</button>
                <button type="button" class="btn">宿日直</button>
                <button type="button" class="btn">貸出返却</button>
                <button type="button" class="btn">点検実績</button>
            </div>

            <!-- サブメニューボタン群 -->
            <div class="sub-btn-group">
                <button type="button" class="btn-sub">新人日報</button>
                <button type="button" class="btn-sub">カンファレンス</button>
                <button type="button" class="btn-sub">症例検討</button>
                <button type="button" class="btn-sub">心カテ共有事項</button>
                <button type="button" class="btn-sub">年報</button>
                <button type="button" class="btn-sub">研修実績</button>
            </div>

        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
