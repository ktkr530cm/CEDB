<!-- 機器台帳 一覧画面 -->
<div id="ledger-page" class="page">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
        <h2>機器台帳一覧</h2>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="btn" style="width: auto; padding: 10px 20px; font-size: 15px;" onclick="openNewLedgerForm()">＋ 新規登録</button>
            <button class="btn-sub" style="width: auto; padding: 10px 20px; font-size: 15px;" onclick="switchTab('main-page')">🏠 メインに戻る</button>
        </div>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; align-items: center;">
        <input type="text" id="ledger-search-input" placeholder="CE番号・機種名・メーカー・配置場所で検索"
               style="flex: 1; min-width: 220px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;"
               onkeydown="if(event.key === 'Enter') searchLedger();">
        <button class="btn" style="width: auto; padding: 10px 20px; font-size: 15px; background-color: #3498db;" onclick="searchLedger()">🔍 検索</button>
        <button class="btn-sub" style="width: auto; padding: 10px 20px; font-size: 15px;" onclick="clearLedgerSearch()">クリア</button>
    </div>

    <div style="overflow-x: auto;">
        <table class="record-table">
            <thead>
                <tr>
                    <th style="width: 12%;">CE番号</th>
                    <th style="width: 10%;">機器分類</th>
                    <th style="width: 16%;">機種名</th>
                    <th style="width: 12%;">メーカー</th>
                    <th style="width: 12%;">配置場所</th>
                    <th style="width: 10%;">稼働状況</th>
                    <th style="width: 18%;">保守状況</th>
                    <th style="width: 10%;">操作</th>
                </tr>
            </thead>
            <tbody id="ledger-table-body"></tbody>
        </table>
    </div>
</div>

<!-- 機器台帳 入力画面(単票フォーム) -->
<div id="ledger-form-page" class="page">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 id="form-title">機器台帳 登録・編集</h2>
        <button type="button" class="btn-sub" style="width: auto; padding: 8px 16px;" onclick="cancelLedgerForm()">一覧に戻る</button>
    </div>

    <form id="ledger-form" class="single-record-form" onsubmit="event.preventDefault(); saveLedger();">
        <input type="hidden" id="ledger-id">

        <h3 class="form-section-title">基本情報</h3>
        <div class="form-grid">
            <div class="form-group">
                <label for="ce-number">CE番号 <span class="required">*</span></label>
                <input type="text" id="ce-number" placeholder="例: CE-00123" required>
            </div>
            <div class="form-group">
                <label for="device-category">機器分類</label>
                <select id="device-category">
                    <option value="">選択してください</option>
                    <option value="輸液ポンプ">輸液ポンプ</option>
                    <option value="シリンジポンプ">シリンジポンプ</option>
                    <option value="人工呼吸器">人工呼吸器</option>
                    <option value="生体情報モニタ">生体情報モニタ</option>
                    <option value="除細動器">除細動器</option>
                    <option value="その他">その他</option>
                </select>
            </div>
            <div class="form-group">
                <label for="model-name">機種名 <span class="required">*</span></label>
                <input type="text" id="model-name" placeholder="例: ○○○○-100" required>
            </div>
            <div class="form-group">
                <label for="manufacturer">メーカー</label>
                <input type="text" id="manufacturer" placeholder="例: ○○メディカル">
            </div>
            <div class="form-group">
                <label for="dept">部署</label>
                <input type="text" id="dept" placeholder="例: ICU">
            </div>
            <div class="form-group">
                <label for="location">配置場所</label>
                <input type="text" id="location" placeholder="例: 3階病棟">
            </div>
            <div class="form-group">
                <label for="operating-status">稼働状況</label>
                <select id="operating-status">
                    <option value="稼働">稼働</option>
                    <option value="修理中">修理中</option>
                    <option value="停止">停止</option>
                </select>
            </div>
        </div>

        <h3 class="form-section-title">識別情報</h3>
        <div class="form-grid">
            <div class="form-group">
                <label for="serial-number">シリアル番号</label>
                <input type="text" id="serial-number" placeholder="例: SN-000123">
            </div>
            <div class="form-group">
                <label for="asset-number">資産番号</label>
                <input type="text" id="asset-number" placeholder="例: A-000123">
            </div>
            <div class="form-group">
                <label for="ch-number">CH番号</label>
                <input type="text" id="ch-number" placeholder="例: CH-001">
            </div>
            <div class="form-group">
                <label for="barcode">バーコード</label>
                <input type="text" id="barcode" placeholder="バーコード番号">
            </div>
            <div class="form-group">
                <label for="gs1-128">GS1-128</label>
                <input type="text" id="gs1-128" placeholder="GS1-128コード">
            </div>
        </div>

        <h3 class="form-section-title">搬入情報</h3>
        <div class="form-grid">
            <div class="form-group">
                <label for="reg-date">登録日</label>
                <input type="date" id="reg-date">
            </div>
            <div class="form-group">
                <label for="delivery-staff">搬入担当者</label>
                <input type="text" id="delivery-staff" placeholder="担当者名">
            </div>
        </div>

        <h3 class="form-section-title">保守情報</h3>
        <div class="form-grid">
            <div class="form-group">
                <label for="maint-status">保守状況</label>
                <select id="maint-status">
                    <option value="契約あり">契約あり</option>
                    <option value="契約なし">契約なし</option>
                    <option value="院内対応">院内対応</option>
                </select>
            </div>
            <div class="form-group">
                <label for="repair-contact">修理連絡先</label>
                <input type="text" id="repair-contact" placeholder="連絡先(電話番号等)">
            </div>
        </div>

        <h3 class="form-section-title">備考</h3>
   <div class="form-grid">
     <div class="form-group col-span-2">
        <label for="remarks">備考</label>
        <textarea id="remarks" rows="4" placeholder="特記事項があれば入力してください"></textarea>
     </div>
    </div>

        <h3 class="form-section-title">備考</h3>
        <div class="form-grid">
            <div class="form-group">
                <label for="remarks">備考</label>
                <textarea id="remarks" rows="4" placeholder="特記事項があれば入力してください"></textarea>
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px;">
            <button type="submit" class="btn" style="width: auto; padding: 10px 24px; font-size: 15px;">💾 保存</button>
            <button type="button" class="btn-sub" style="width: auto; padding: 10px 24px;" onclick="cancelLedgerForm()">キャンセル</button>
            
        </div>
    </form>
</div>
