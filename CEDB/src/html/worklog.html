<style>
    /* スタッフ選択用 6列×2行 グリッド */
    .staff-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px 8px;
        width: 100%;
        min-width: 320px;
    }

    .staff-checkbox-item {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        user-select: none;
    }

    .staff-checkbox-item input[type="checkbox"] {
        width: 14px;
        height: 14px;
        margin: 0;
        cursor: pointer;
    }
</style>

<!-- 連絡事項一覧画面 -->
<div id="worklog-page" class="page">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2>連絡事項一覧</h2>
        <div>
            <button class="btn" style="width: auto; padding: 10px 20px; font-size: 15px; display: inline-block;" onclick="openNewWorklogForm()">＋ 新規作成</button>
            <button class="btn-sub" style="padding: 10px 20px; font-size: 15px; display: inline-block; margin-left: 8px;" onclick="openTab('past-worklog-page', '過去アーカイブ')">過去アーカイブ</button>
        </div>
    </div>

    <div style="overflow-x: auto;">
        <table class="record-table">
            <thead>
                <tr>
                    <th style="width: 10%;">日付</th>
                    <th style="width: 8%;">区分</th>
                    <th style="width: 8%;">重要度</th>
                    <th style="width: 10%;">記入者</th>
                    <th style="width: 34%;">連絡事項</th>
                    <th style="width: 24%;">確認状況</th>
                    <th style="width: 6%;">操作</th>
                </tr>
            </thead>
            <tbody id="log-table-body"></tbody>
        </table>
    </div>
</div>

<!-- 連絡事項 入力画面 -->
<div id="worklog-form-page" class="page">
    <h2 id="form-title">連絡事項 新規登録</h2>

    <div class="worklog-form-panel" style="padding: 25px; border-radius: 8px; border: 1px solid; margin-top: 15px;">
        <form id="worklog-form">
            <input type="hidden" id="log-id">

            <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 20px;">
                <div class="form-group" style="margin-bottom: 0; width: 170px;">
                    <label for="log-date">日付</label>
                    <input type="date" id="log-date" required style="padding: 8px 10px;">
                </div>
                <div class="form-group" style="margin-bottom: 0; width: 130px;">
                    <label for="log-category">区分</label>
                    <select id="log-category" style="padding: 8px 10px;">
                        <option value="臨床">臨床</option>
                        <option value="会議">会議</option>
                        <option value="打合せ">打合せ</option>
                        <option value="学習会">学習会</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0; width: 120px;">
                    <label for="log-priority">重要度</label>
                    <select id="log-priority" style="padding: 8px 10px;">
                        <option value="通常">通常</option>
                        <option value="至急">至急</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0; width: 160px;">
                    <label for="log-author">記入者</label>
                    <select id="log-author" style="padding: 8px 10px;">
                        <option value="">(選択なし)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="log-details">連絡事項</label>
                <textarea id="log-details" rows="6" placeholder="連絡事項の内容を入力してください" required></textarea>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button type="button" class="btn btn-save" onclick="saveWorklog()" style="width: auto; padding: 12px 28px; font-size: 16px;">保存する</button>
                <button type="button" class="btn btn-cancel" style="width: auto; padding: 12px 28px; font-size: 16px;" onclick="cancelWorklogForm()">キャンセル</button>
            </div>   
        </form>
    </div>
</div>

<!-- 過去の連絡事項 アーカイブ画面 -->
<div id="past-worklog-page" class="page">
    <h2 style="margin-bottom: 15px;">過去の連絡事項（全員確認済みアーカイブ）</h2>

    <div style="overflow-x: auto;">
        <table class="record-table">
            <thead>
                <tr style="background-color: #dcdde1;">
                    <th style="width: 10%;">日付</th>
                    <th style="width: 8%;">区分</th>
                    <th style="width: 8%;">重要度</th>
                    <th style="width: 10%;">記入者</th>
                    <th style="width: 34%;">連絡事項</th>
                    <th style="width: 24%;">確認状況</th>
                    <th style="width: 6%;">操作</th>
                </tr>
            </thead>
            <tbody id="completed-log-table-body"></tbody>
        </table>
    </div>
</div>
