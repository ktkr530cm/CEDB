<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臨床工学科 データベース</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;

        }
        /* ヘッダー */
        .app-header {
            background-color: #02104E;
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;

        }
            .app-header h1 {
                margin: 0;
                font-size: 40px;
                font-weight: bold;
                line-height: 1.2;
                color: white;
                text-align: left;
            }

        /* タブバー */
        .tab-bar {
            display: flex;
            background-color: #1a252f;
            overflow-x: auto;
            border-bottom: 3px solid #3498db;
            width: 100%;
        }

        .tab-item {
            padding: 12px 20px;
            color: #bdc3c7;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .tab-item:hover {
                background-color: rgba(255, 255, 255, 0.1);
                color: white;
            }

            .tab-item.active {
                background-color: #3498db;
                color: white;
            }

        .tab-close-btn {
            font-size: 12px;
            border-radius: 50%;
            padding: 2px 6px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            line-height: 1;
        }

            .tab-close-btn:hover {
                background: #e74c3c;
            }


        /* フォーム系 */
        .form-group {
            margin-bottom: 15px;
        }

            .form-group label {
                display: block;
                margin-bottom: 6px;
                font-weight: bold;
                font-size: 14px;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 14px;
            }

        /* スタッフ選択用 6列×2行 グリッド */
        .staff-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px 8px;
            width: 100%;
            min-width: 320px;
        }

        .staff-checkbox-item {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }

            .staff-checkbox-item input[type="checkbox"] {
                width: 14px;
                height: 14px;
                margin: 0;
                cursor: pointer;
            }

        /* 重要度バッジ */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-align: center;
        }

        .badge-high {
            background-color: #e74c3c;
        }

        .badge-med {
            background-color: #f39c12;
        }

        .badge-low {
            background-color: #95a5a6;
        }

        /* テーブル設定 */
        .record-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
            background-color: #fff;
            min-width: 900px;
        }

            .record-table th, .record-table td {
                border: 1px solid #bdc3c7;
                padding: 10px 8px;
                text-align: left;
                vertical-align: middle;
            }

            .record-table th {
                background-color: #e9ecef;
                font-weight: bold;
                color: #2c3e50;
            }

            .record-table tr:nth-child(even) {
                background-color: #f8f9fa;
            }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

            .btn-delete:hover {
                background-color: #c0392b;
            }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="app-header">
        <h1>臨床工学科データベース</h1>
    </header>

    <!-- アプリ内 タブバー -->
    <nav class="tab-bar" id="tab-bar">
        <button class="tab-item active" onclick="switchTab('main-page')">🏠 メニュー</button>
    </nav>

    <div class="container">
        <div id="main-container"></div>
        <div id="worklog-container"></div>
        <div id="ledger-container"></div>
    </div>

    <!-- JavaScriptファイルの読み込み -->
    <script src="../js/app.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/worklog.js"></script>
    <script src="../js/ledger.js"></script>
</body>
</html>
