<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機器台帳</title>
    <link rel="stylesheet" href="ledger.css">
</head>
<body>

    <!-- 1. 機器台帳 一覧画面 -->
    <div id="ledger-page" class="page">
        <div class="ledger-container">

            <!-- 左サイドバー（共通操作パネル） -->
            <aside class="ledger-sidebar">
                <h2>機器台帳 メニュー</h2>
                <div>
                    <button class="btn" onclick="openNewLedgerForm()">＋ 新規登録</button>
                </div>
                <hr>
                <div>
                    <label>絞り込み検索</label>
                    <input type="text" id="ledger-search-input" placeholder="CE番号・機種名等..." onkeydown="if(event.key === 'Enter') searchLedger();">
                    <div>
                        <button class="btn-sub" onclick="clearLedgerSearch()">クリア</button>
                    </div>
                </div>
                <hr>
                <button class="btn-sub" onclick="resetLedgerColumnOrder()" title="列の並び順を初期状態に戻します">↺ 列順リセット</button>
            </aside>

            <!-- 右側メインエリア：一覧テーブル -->
            <main>
                <div>
                    <table class="record-table">
                        <thead>
                            <tr id="ledger-table-head-row">
                                <!-- 列ヘッダーはJSで動的生成 -->
                            </tr>
                        </thead>
                        <tbody id="ledger-table-body"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- 2. 機器台帳 入力画面(単票フォーム) -->
    <div id="ledger-form-page" class="page">
        <div class="ledger-container">

            <!-- 左サイドバー（操作・アクション用） -->
            <aside class="ledger-sidebar">
                <h2>機器台帳 メニュー</h2>
                
                <!-- 保存・キャンセルボタン -->
                <div>
                   <button type="submit" form="ledger-form" class="btn-success">💾 保存</button>
                   <button type="button" class="btn-sub" onclick="cancelLedgerForm()">キャンセル</button>
                </div>

                <hr>

                <button type="button" class="btn-sub" onclick="cancelLedgerForm()">← 一覧に戻る</button>
            </aside>

            <!-- 右側メインエリア：入力フォーム -->
            <main>
                <div>
                    <h2 id="form-title">機器台帳 登録・編集</h2>
                </div>

                <form id="ledger-form" class="single-record-form" onsubmit="event.preventDefault(); saveLedger();">
                    <input type="hidden" id="ledger-id">

                    <h3 class="form-section-title">基本情報</h3>
                    <div class="form-grid">
                        
                        <div class="form-group">
                            <label for="ce-number">CE番号 <span class="required">*</span></label>
                            <input type="text" id="ce-number" placeholder="例: CE-00123" required>
                        </div>

                        <div class="form-group">
                          <label for="prev-dept">前部署</label>
                          <input type="text" id="prev-dept" placeholder="例: 2階病棟">
                        </div>

                        <div class="form-group">
                            <label for="operating-status">稼働状況</label>
                            <select id="operating-status">
                                <option value="稼働">稼働</option>
                                <option value="廃棄待ち">廃棄待ち</option>
                                <option value="廃棄">廃棄</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="device-category">機器分類</label>
                            <select id="device-category">
                                <option value="">選択してください</option>
                                <option value="生体情報モニタ">生体情報モニタ</option>
                                <option value="送信機">送信機</option>
                                <option value="輸液ポンプ">輸液ポンプ</option>
                                <option value="シリンジポンプ">シリンジポンプ</option>
                                <option value="人工呼吸器">人工呼吸器</option>
                                <option value="フットポンプ">フットポンプ</option>
                                <option value="除細動器">除細動器</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="model-name">機種名 <span class="required">*</span></label>
                            <input type="text" id="model-name" placeholder="例: ○○○○-100" required oninput="updateDeviceImagePreview()">
                        </div>
                        <div class="form-group">
                            <label for="manufacturer">メーカー</label>
                            <select id="manufacturer">
                                <option value="">選択してください</option>
                                <option value="日本光電">日本光電</option>
                                <option value="フクダ電子">フクダ電子</option>
                                <option value="コヴィディエン">コヴィディエン</option>
                                <option value="東レ">東レ</option>
                                <option value="アトム">アトム</option>
                                <option value="トーイツ">トーイツ</option>
                                <option value="テルモ">テルモ</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="dept">部署</label>
                            <input type="text" id="dept" placeholder="例: ICU">
                        </div>
                        <div class="form-group">
                            <label for="location">配置場所</label>
                            <input type="text" id="location" placeholder="例: 3階病棟">
                        </div>
                        
                    </div>

                    <h3 class="form-section-title">識別・コード情報</h3>
<div class="form-grid">
    <div class="form-group">
        <label for="serial-number">シリアル</label>
        <input type="text" id="serial-number" placeholder="S/N">
    </div>
    <div class="form-group">
        <label for="asset-number">資産番号</label>
        <input type="text" id="asset-number" placeholder="資産番号">
    </div>
    <div class="form-group">
        <label for="ch-number">CH番号</label>
        <input type="text" id="ch-number" placeholder="CH番号">
    </div>
    <div class="form-group">
        <label for="barcode">バーコード</label>
        <input type="text" id="barcode" placeholder="バーコード">
    </div>
    <div class="form-group">
        <label for="gs1">GS1-128</label>
        <input type="text" id="gs1" placeholder="GS1コード">
    </div>
    <div class="form-group">
        <label for="years-in-use">耐用年数</label>
        <input type="number" id="years-in-use" placeholder="例: 6">
    </div>
</div>

                    <h3 class="form-section-title">登録・廃棄情報</h3>
<div class="form-grid">
    <div class="form-group">
        <label for="reg-date">登録日</label>
        <input type="date" id="reg-date">
    </div>
    <div class="form-group">
        <label for="delivery-staff">納入担当者</label>
        <input type="text" id="delivery-staff" placeholder="担当者名">
    </div>
    <div class="form-group">
        <!-- ID重複を解消 -->
        <label for="disposal-date">廃棄日</label>
        <input type="date" id="disposal-date">
    </div>
    <div class="form-group">
        <!-- ID重複を解消 -->
        <label for="disposal-staff">廃棄担当者</label>
        <input type="text" id="disposal-staff" placeholder="担当者名">
    </div>
    <div class="form-group col-span-2">
        <!-- 全角スペース除去 -->
        <label for="disposal-reason">廃棄理由</label>
        <textarea id="disposal-reason" rows="2" placeholder="廃棄理由を記入してください"></textarea>
    </div>
</div>

                    <h3 class="form-section-title">保守情報</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="maint-status">保守状況</label>
                            <select id="maint-status">
                                <option value="保守継続">保守継続</option>
                                <option value="保守終了">保守終了</option>
                                <option value="院内対応">院内対応</option>
                            </select>
                        </div>
                        <div class="form-group">
    <label for="repair-company">修理業者名</label>
    <input type="text" id="repair-company" placeholder="例: ○○メディカル">
    <input type="tel" id="repair-tel" placeholder="連絡先">
</div>

                        <div class="form-group">
                            <label for="bimonthly-inspection">点検頻度</label>
                            <select id="bimonthly-inspection">
                                <option value="">選択してください</option>
                                <option value="毎日点検">毎日点検</option>
                                <option value="始業点検">始業点検</option>
                                <option value="毎週点検">毎週点検</option>
                                <option value="毎月点検">毎月点検</option>
                                <option value="隔月点検">隔月点検</option>
                            </select>
                        </div>
 <div class="form-group">
                            <label for="Inspection person">点検担当</label>
                            <select id="inspection-person">
                                <option value="">選択してください</option>
                                <option value="カテ担当">カテ担当</option>
                                <option value="臨床担当">臨床担当</option>
                                <option value="ＯＰＥ担当">ＯＰＥ担当</option>
                                <option value="保守担当">保守担当</option>
                                <option value="透析担当">透析担当</option>
                                <option value="ＨＢＯ担当">ＨＢＯ担当</option>
                                <option value="使用後担当">使用後担当</option>
                                <option value="２ｎｄ担当">２ｎｄ担当</option>
                            </select>
                        </div>

                        <div class="form-group">
    <label for="inspection-month">点検月</label>
    <select id="bimonthly-inspection">
                                <option value="">選択してください</option>
                                <option value="４月">４月</option>
                                <option value="５月">５月</option>
                                <option value="６月">６月</option>
                                <option value="７月">７月</option>
                                <option value="８月">８月</option>
                                <option value="９月">９月</option>
                                <option value="１０月">１０月</option>
                                <option value="１１月">１１月</option>
                                <option value="１２月">１２月</option>
                                <option value="１月">１月</option>
                                <option value="２月">２月</option>
                                <option value="３月">３月</option>
    </select>
    </div>
<div class="form-group">
    <label for="inspection-week">点検週</label>
    <select id="inspection-week">
                                <option value="">選択してください</option>
                                <option value="１週目">１週目</option>
                                <option value="２週目">２週目</option>
                                <option value="３週目">３週目</option>
                                <option value="４週目">４週目</option>
    </select>
</div>

                       

                    </div>

                    <h3 class="form-section-title">備考</h3>
                    <div class="form-grid">
                        <div class="form-group col-span-2">
                            <label for="remarks">備考</label>
                            <textarea id="remarks" rows="2" placeholder="特記事項があれば入力してください"></textarea>
                        </div>
                    </div>
                </form>
            </main>
        </div>
    </div>
    

<!-- JavaScriptの読み込み -->
<script src="ledger.js"></script>

</body>
</html>
