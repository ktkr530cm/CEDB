<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機器台帳</title>
    <link rel="stylesheet" href="ledger.css">
</head>
<body>

    <!-- 1. 機器台帳 一覧画面 -->
    <div id="ledger-page" class="page">
        <div class="ledger-container">

            <!-- 左サイドバー（共通操作パネル） -->
            <aside class="ledger-sidebar">
                <h2>機器台帳 メニュー</h2>
                <div>
                    <button type="button" class="btn" onclick="openNewLedgerForm()">＋ 新規登録</button>
                </div>
                <hr>
                
                <!-- 検索エリア -->
                <div class="search-box-container">
                    <label for="ledger-search-input" class="search-label">絞り込み検索</label>
                    
                    <!-- 検索キーワード入力 -->
                    <div class="search-input-wrapper">
                        <input type="text" id="ledger-search-input" placeholder="キーワードを入力..." onkeydown="if(event.key === 'Enter') searchLedger();">
                    </div>

                    <!-- 検索対象列の複数選択パネル -->
                    <div class="search-target-wrapper">
                        <div class="search-target-header">
                            <span class="search-target-title">検索対象項目（複数選択可）</span>
                            <div class="action-links">
                                <button type="button" class="link-btn" onclick="selectAllSearchTargets(true)">全選択</button>
                                <button type="button" class="link-btn" onclick="selectAllSearchTargets(false)">全解除</button>
                            </div>
                        </div>
                        
                        <!-- JavaScriptで動的生成されるチェックボックスコンテナ -->
                        <div id="search-target-checkboxes" class="checkbox-container"></div>
                    </div>

                    <div class="search-btn-group">
                        <button type="button" class="btn-sub" onclick="clearLedgerSearch()">クリア</button>
                    </div>
                </div>

                <hr>
                <button type="button" class="btn-sub" onclick="resetLedgerColumnOrder()" title="列の並び順を初期状態に戻します">↺ 列順リセット</button>
                <button type="button" class="btn-sub" onclick="toggleColumnVisibilityPanel()" title="表示する列を選択します">☑ 表示列の設定</button>

                <div id="ledger-column-visibility-panel" class="column-visibility-panel" style="display:none;">
                    <div class="column-visibility-header">
                        <span>表示する列</span>
                        <div class="column-visibility-actions">
                            <button type="button" class="link-btn" onclick="setAllColumnsVisibility(true)">全選択</button>
                            <button type="button" class="link-btn" onclick="setAllColumnsVisibility(false)">全解除</button>
                        </div>
                    </div>
                    <div id="ledger-column-visibility-list" class="column-visibility-list"></div>
                </div>
            </aside>

            <!-- 右側メインエリア：一覧テーブル -->
            <main class="ledger-main">
                <div class="table-wrapper">
                    <table class="record-table">
                        <thead>
                            <tr id="ledger-table-head-row">
                                <!-- 列ヘッダーはJSで動的生成 -->
                            </tr>
                        </thead>
                        <tbody id="ledger-table-body"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- 2. 機器台帳 入力画面(単票フォーム) -->
    <div id="ledger-form-page" class="page">
        <div class="ledger-container">

            <!-- 左サイドバー（操作・アクション用） -->
            <aside class="ledger-sidebar">
                <h2>機器台帳 メニュー</h2>
                
                <!-- 保存・キャンセルボタン -->
                <div class="form-actions-sidebar">
                    <button type="submit" form="ledger-form" class="btn-success">💾 保存</button>
                    <button type="button" class="btn-sub" onclick="cancelLedgerForm()">キャンセル</button>
                </div>

                <hr>

                <button type="button" class="btn-sub" onclick="cancelLedgerForm()">← 一覧に戻る</button>
            </aside>

            <!-- 右側メインエリア：入力フォーム -->
            <main class="ledger-main">
                <div class="form-header">
                    <h2 id="form-title">機器台帳 登録・編集</h2>
                </div>

                <form id="ledger-form" class="single-record-form" onsubmit="event.preventDefault(); saveLedger();">
                    <input type="hidden" id="ledger-id" name="ledger-id">

                    <h3 class="form-section-title">基本情報</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="ce-number">CE番号 <span class="required">*</span></label>
                            <input type="text" id="ce-number" name="ce-number" placeholder="例: CE-00123" required>
                        </div>

                        <div class="form-group">
                            <label for="prev-dept">前部署</label>
                            <input type="text" id="prev-dept" name="prev-dept" placeholder="例: 2階病棟">
                        </div>

                        <div class="form-group">
                            <label for="operating-status">稼働状況</label>
                            <select id="operating-status" name="operating-status">
                                <option value="稼働">稼働</option>
                                <option value="廃棄待ち">廃棄待ち</option>
                                <option value="廃棄">廃棄</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="device-category">機器分類</label>
                            <select id="device-category" name="device-category">
                                <option value="">選択してください</option>
                                <option value="生体情報モニタ">生体情報モニタ</option>
                                <option value="送信機">送信機</option>
                                <option value="輸液ポンプ">輸液ポンプ</option>
                                <option value="シリンジポンプ">シリンジポンプ</option>
                                <option value="人工呼吸器">人工呼吸器</option>
                                <option value="フットポンプ">フットポンプ</option>
                                <option value="除細動器">除細動器</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="model-name">機種名 <span class="required">*</span></label>
                            <input type="text" id="model-name" name="model-name" placeholder="例: ○○○○-100" required oninput="updateDeviceImagePreview()">
                        </div>

                        <div class="form-group">
                            <label for="manufacturer">メーカー</label>
                            <select id="manufacturer" name="manufacturer">
                                <option value="">選択してください</option>
                                <option value="日本光電">日本光電</option>
                                <option value="フクダ電子">フクダ電子</option>
                                <option value="コヴィディエン">コヴィディエン</option>
                                <option value="東レ">東レ</option>
                                <option value="アトム">アトム</option>
                                <option value="トーイツ">トーイツ</option>
                                <option value="テルモ">テルモ</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="dept">部署</label>
                            <input type="text" id="dept" name="dept" placeholder="例: ICU">
                        </div>

                        <div class="form-group">
                            <label for="location">配置場所</label>
                            <input type="text" id="location" name="location" placeholder="例: 3階病棟">
                        </div>
                    </div>

                    <h3 class="form-section-title">識別・コード情報</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="serial-number">シリアル</label>
                            <input type="text" id="serial-number" name="serial-number" placeholder="S/N">
                        </div>
                        <div class="form-group">
                            <label for="asset-number">資産番号</label>
                            <input type="text" id="asset-number" name="asset-number" placeholder="資産番号">
                        </div>
                        <div class="form-group">
                            <label for="ch-number">CH番号</label>
                            <input type="text" id="ch-number" name="ch-number" placeholder="CH番号">
                        </div>
                        <div class="form-group">
                            <label for="barcode">バーコード</label>
                            <input type="text" id="barcode" name="barcode" placeholder="バーコード">
                        </div>
                        <div class="form-group">
                            <label for="gs1">GS1-128</label>
                            <input type="text" id="gs1" name="gs1" placeholder="GS1コード">
                        </div>
                    </div>

                    <h3 class="form-section-title">登録・廃棄情報</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="reg-date">登録日</label>
                            <input type="date" id="reg-date" name="reg-date">
                        </div>
                        <div class="form-group">
                            <label for="delivery-staff">納入担当者</label>
                            <input type="text" id="delivery-staff" name="delivery-staff" placeholder="担当者名">
                        </div>
                        <div class="form-group">
                            <label for="disposal-date">廃棄日</label>
                            <input type="date" id="disposal-date" name="disposal-date">
                        </div>
                        <div class="form-group">
                            <label for="disposal-staff">廃棄担当者</label>
                            <input type="text" id="disposal-staff" name="disposal-staff" placeholder="担当者名">
                        </div>
                        <div class="form-group col-span-2">
                            <label for="disposal-reason">廃棄理由</label>
                            <textarea id="disposal-reason" name="disposal-reason" rows="2" placeholder="廃棄理由を記入してください"></textarea>
                        </div>
                    </div>

                    <h3 class="form-section-title">保守情報</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="maint-status">保守状況</label>
                            <select id="maint-status" name="maint-status">
                                <option value="保守継続">保守継続</option>
                                <option value="保守終了">保守終了</option>
                                <option value="院内対応">院内対応</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="repair-company">修理業者名</label>
                            <input type="text" id="repair-company" name="repair-company" placeholder="例: ○○メディカル">
                        </div>

                        <div class="form-group">
                            <label for="repair-tel">修理業者 連絡先</label>
                            <input type="tel" id="repair-tel" name="repair-tel" placeholder="00-0000-0000">
                        </div>

                        <div class="form-group">
                            <label for="bimonthly-inspection">点検頻度</label>
                            <select id="bimonthly-inspection" name="bimonthly-inspection">
                                <option value="">選択してください</option>
                                <option value="毎日点検">毎日点検</option>
                                <option value="始業点検">始業点検</option>
                                <option value="毎週点検">毎週点検</option>
                                <option value="毎月点検">毎月点検</option>
                                <option value="隔月点検">隔月点検</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="inspection-person">点検担当</label>
                            <select id="inspection-person" name="inspection-person">
                                <option value="">選択してください</option>
                                <option value="カテ担当">カテ担当</option>
                                <option value="臨床担当">臨床担当</option>
                                <option value="OPE担当">OPE担当</option>
                                <option value="保守担当">保守担当</option>
                                <option value="透析担当">透析担当</option>
                                <option value="HBO担当">HBO担当</option>
                                <option value="使用後担当">使用後担当</option>
                                <option value="2nd担当">2nd担当</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="inspection-month">点検月</label>
                            <select id="inspection-month" name="inspection-month">
                                <option value="">選択してください</option>
                                <option value="4月">4月</option>
                                <option value="5月">5月</option>
                                <option value="6月">6月</option>
                                <option value="7月">7月</option>
                                <option value="8月">8月</option>
                                <option value="9月">9月</option>
                                <option value="10月">10月</option>
                                <option value="11月">11月</option>
                                <option value="12月">12月</option>
                                <option value="1月">1月</option>
                                <option value="2月">2月</option>
                                <option value="3月">3月</option>
                            </select>
                        </div>
                    </div>

                    <h3 class="form-section-title">備考</h3>
                    <div class="form-grid">
                        <div class="form-group col-span-2">
                            <label for="remarks">備考</label>
                            <textarea id="remarks" name="remarks" rows="2" placeholder="特記事項があれば入力してください"></textarea>
                        </div>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <!-- JavaScriptの読み込み -->
    <script src="ledger.js"></script>
</body>
</html>
