<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連絡事項一覧</title>
    <link rel="stylesheet" href="worklog.css">
</head>
<body>

<!-- 連絡事項一覧画面 -->
<div id="worklog-page" class="page active">
    <div class="header-container">
        <h2>連絡事項一覧</h2>
    </div>
    <div class="btn-group-right">
    <button type="button" class="btn btn-sm" onclick="openNewWorklogForm()">＋ 新規作成</button>
    <button type="button" class="btn btn-sub btn-sm" onclick="switchWorklogTab('past-worklog-page')">過去アーカイブ</button>
</div>

    <div class="table-container">
        <table class="record-table">
            <!-- 【修正後】 -->
<thead>
    <tr>
        <th>日付</th>
        <th>重要度</th>
        <th>記入者</th>
        <th>連絡事項</th>
        <th>確認状況</th>
        <th>操作</th>
    </tr>
</thead>
            <tbody id="log-table-body"></tbody>
        </table>
    </div>
</div>

<!-- 連絡事項 -->
<div id="past-worklog-page" class="page">
    <div class="header-container">
        <h2>過去の連絡事項（全員確認済みアーカイブ）</h2>
    </div>
    <div class="btn-group-right">
        <button type="button" class="btn btn-sub btn-sm" onclick="switchWorklogTab('worklog-page')">一覧へ戻る</button>
    </div>
    <div>
        <table class="record-table">
            <thead>
                <tr>
                    <th>日付</th>
                    <th>重要度</th>
                    <th>記入者</th>
                    <th>連絡事項</th>
                    <th>確認状況</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="completed-log-table-body"></tbody>
        </table>
    </div>
</div>

<!-- 連絡事項 入力・編集フォーム画面 -->
<div id="worklog-form-page" class="page">
    <div class="header-container">
        <h2 id="form-title">連絡事項 新規登録</h2>
    </div>

        <div class="worklog-form-panel">
        <input type="hidden" id="log-id">

        <div class="form-row">
            <div class="form-group">
                <label for="log-date">日付</label>
                <input type="date" id="log-date">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="log-priority">重要度</label>
                <select id="log-priority">
                    <option value="通常">通常</option>
                    <option value="至急">至急</option>
                </select>
            </div>
            <div class="form-group">
                <label for="log-author">記入者</label>
                <select id="log-author"></select>
            </div>
        </div>

        <div class="form-group">
            <label for="log-details">連絡事項</label>

            <div class="editor-toolbar">
                <select id="log-font-family" onchange="applyFontFamily(this.value)" title="フォント">
                    <option value="">フォント</option>
                    <option value="'Yu Gothic', sans-serif">ゴシック体</option>
                    <option value="'Yu Mincho', serif">明朝体</option>
                    <option value="Meiryo, sans-serif">メイリオ</option>
                    <option value="'Courier New', monospace">等幅</option>
                </select>

                <select id="log-font-size" onchange="applyFontSize(this.value)" title="文字サイズ">
                    <option value="">サイズ</option>
                    <option value="12">12px</option>
                    <option value="14">14px</option>
                    <option value="16">16px</option>
                    <option value="18">18px</option>
                    <option value="24">24px</option>
                    <option value="32">32px</option>
                </select>

                <span class="color-swatch-group" title="文字色">
    <button type="button" class="color-swatch-btn" style="background-color:#e30613;" onmousedown="event.preventDefault()" onclick="applyFontColor('#e30613')" aria-label="赤"></button>
    <button type="button" class="color-swatch-btn" style="background-color:#0033cc;" onmousedown="event.preventDefault()" onclick="applyFontColor('#0033cc')" aria-label="青"></button>
    <button type="button" class="color-swatch-btn" style="background-color:#009944;" onmousedown="event.preventDefault()" onclick="applyFontColor('#009944')" aria-label="緑"></button>
                </span>

                <button type="button" class="editor-btn" onmousedown="event.preventDefault()" onclick="toggleFormat('bold')" title="太字"><b>B</b></button>
                <button type="button" class="editor-btn" onmousedown="event.preventDefault()" onclick="toggleFormat('underline')" title="下線"><u>U</u></button>
                <button type="button" class="editor-btn editor-btn-clear" onmousedown="event.preventDefault()" onclick="clearFormat()" title="書式クリア">クリア</button>
            </div>

            <div id="log-details" class="rich-editor" contenteditable="true" data-placeholder="連絡事項を入力してください"></div>
        </div>

        <div class="form-buttons">
            <button type="button" class="btn btn-save" onclick="saveWorklog()">保存</button>
            <button type="button" class="btn btn-cancel" onclick="cancelWorklogForm()">キャンセル</button>
        </div>
    </div>
</div>


<!-- JavaScriptの読み込み -->
<script src="worklog.js"></script>
</body>
</html>
