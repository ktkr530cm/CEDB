<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臨床工学科 データベース</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        /* ヘッダー */
        .app-header {
            background-color: #02104E;
            color: white;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

            .app-header h1 {
                margin: 0;
                font-size: 28px;
            }

        /* タブナビゲーションバー */
        .tab-bar {
            display: flex;
            background-color: #1a252f;
            overflow-x: auto;
            border-bottom: 3px solid #3498db;
        }

        .tab-item {
            padding: 12px 20px;
            color: #bdc3c7;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .tab-item:hover {
                background-color: rgba(255, 255, 255, 0.1);
                color: white;
            }

            /* 選択されている（アクティブな）タブ */
            .tab-item.active {
                background-color: #3498db;
                color: white;
            }

        /* タブを閉じる小ボタン */
        .tab-close-btn {
            font-size: 12px;
            border-radius: 50%;
            padding: 2px 6px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            line-height: 1;
        }

            .tab-close-btn:hover {
                background: #e74c3c;
            }

        /* メインコンテンツコンテナ */
        .container {
            max-width: 98% !important;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        /* タブのページ切り替え */
        .page {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

            .page.active {
                display: block !important;
            }

        /* メインボタン群（3列配置） */
        .main-btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 32px 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s, transform 0.1s;
        }

            .btn:hover {
                background-color: #2980b9;
            }

            .btn:active {
                transform: scale(0.98);
            }

        .btn-back {
            background-color: #7f8c8d;
        }

        .sub-btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .btn-sub {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px 10px;
            background-color: #e2e8f0;
            color: #2c3e50;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

            .btn-sub:hover {
                background-color: #cbd5e1;
            }

        /* テーブル設定 */
        .record-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
            background-color: #fff;
        }

            .record-table th, .record-table td {
                border: 1px solid #bdc3c7;
                padding: 12px;
                text-align: left;
                vertical-align: middle;
            }

            .record-table th {
                background-color: #e9ecef;
                font-weight: bold;
                color: #2c3e50;
            }

            .record-table tr:nth-child(even) {
                background-color: #f8f9fa;
            }

        /* フォーム系 */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        /* 重要度バッジ */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-align: center;
        }

        .badge-high {
            background-color: #e74c3c;
        }

        .badge-med {
            background-color: #f39c12;
        }

        .badge-low {
            background-color: #95a5a6;
        }

        @media (max-width: 768px) {
            .main-btn-group {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .main-btn-group, .sub-btn-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="app-header">
        <h1>臨床工学科データベース</h1>
    </header>

    <!-- アプリ内 タブバー（動的切替） -->
    <nav class="tab-bar" id="tab-bar">
        <button class="tab-item active" onclick="switchTab('main-page')">🏠 メニュー</button>
    </nav>

    <div class="container">

        <!-- 1. メインメニュー画面 -->
        <div id="main-page" class="page active">
            <h2>メイン機能メニュー</h2>
            <div class="main-btn-group">
                <button type="button" class="btn" onclick="openTab('worklog-page', '📋 連絡事項一覧')">連絡事項</button>
                <button type="button" class="btn" onclick="alert('機器台帳画面は準備中です')">機器台帳</button>
                <button type="button" class="btn" onclick="alert('不具合対応画面は準備中です')">不具合対応</button>
                <button type="button" class="btn" onclick="alert('物品購入画面は準備中です')">物品購入</button>
                <button type="button" class="btn" onclick="alert('臨床実績画面は準備中です')">臨床実績</button>
                <button type="button" class="btn" onclick="alert('宿日直画面は準備中です')">宿日直</button>
                <button type="button" class="btn" onclick="alert('貸出返却画面は準備中です')">貸出返却</button>
                <button type="button" class="btn" onclick="alert('点検実績画面は準備中です')">点検実績</button>
            </div>

            <div class="sub-btn-group">
                <button type="button" class="btn-sub" onclick="alert('新人日報画面は準備中です')">新人日報</button>
                <button type="button" class="btn-sub" onclick="alert('年報画面は準備中です')">年報</button>
                <button type="button" class="btn-sub" onclick="alert('研修実績画面は準備中です')">研修実績</button>
            </div>
        </div>

        <!-- 2. 連絡事項 一覧画面 -->
        <div id="worklog-page" class="page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn" style="width: auto; padding: 10px 20px; font-size: 15px; background-color: #2ecc71;" onclick="openTab('worklog-form-page', '➕ 連絡事項 新規登録')">＋ 新規登録</button>
                    <button type="button" class="btn" style="width: auto; padding: 10px 20px; font-size: 15px; background-color: #7f8c8d;" onclick="openTab('past-worklog-page', '📁 過去の連絡事項')">📁 過去の連絡事項</button>
                </div>
            </div>

            <h2>連絡事項 一覧（未完了）</h2>

            <div style="overflow-x: auto; margin-bottom: 20px;">
                <table class="record-table">
                    <thead>
                        <tr>
                            <th style="width: 8%;">日付</th>
                            <th style="width: 8%;">区分</th>
                            <th style="width: 8%;">重要度</th>
                            <th style="width: 10%;">記入者</th>
                            <th style="width: 40%;">連絡事項</th>
                            <th style="width: 18%;">確認状況（12名）</th>
                            <th style="width: 8%;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body">
                        <!-- app.jsから描画 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 3. 連絡事項 入力画面 -->
        <div id="worklog-form-page" class="page">
            <h2 id="form-title">連絡事項 新規登録</h2>

            <div style="background-color: #f8f9fa; padding: 25px; border-radius: 8px; border: 1px solid #dee2e6;">
                <form id="worklog-form">
                    <input type="hidden" id="log-id">

                    <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 20px;">
                        <div class="form-group" style="margin-bottom: 0; width: 170px;">
                            <label for="log-date">日付</label>
                            <input type="date" id="log-date" required style="padding: 8px 10px;">
                        </div>
                        <div class="form-group" style="margin-bottom: 0; width: 130px;">
                            <label for="log-category">区分</label>
                            <select id="log-category" style="padding: 8px 10px;">
                                <option value="臨床">臨床</option>
                                <option value="会議">会議</option>
                                <option value="打合せ">打合せ</option>
                                <option value="学習会">学習会</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0; width: 120px;">
                            <label for="log-priority">重要度</label>
                            <select id="log-priority" style="padding: 8px 10px;">
                                <option value="通常">通常</option>
                                <option value="重要">重要</option>
                                <option value="緊急">緊急</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0; width: 160px;">
                            <label for="log-author">記入者</label>
                            <select id="log-author" style="padding: 8px 10px;">
                                <option value="">(選択なし)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="log-details">連絡事項</label>
                        <textarea id="log-details" rows="6" placeholder="連絡事項の内容を入力してください" required></textarea>
                    </div>

                    <div style="display: flex; gap: 15px; margin-top: 20px;">
                        <button type="submit" class="btn" style="background-color: #2ecc71; width: auto; padding: 12px 28px; font-size: 16px;">保存する</button>
                        <button type="button" class="btn" style="background-color: #95a5a6; width: auto; padding: 12px 28px; font-size: 16px;" onclick="closeTab('worklog-form-page')">キャンセル</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 4. 過去の連絡事項 専用画面 -->
        <div id="past-worklog-page" class="page">
            <h2>過去の連絡事項（全員確認済みアーカイブ）</h2>

            <div style="overflow-x: auto;">
                <table class="record-table">
                    <thead>
                        <tr style="background-color: #dcdde1;">
                            <th style="width: 8%;">日付</th>
                            <th style="width: 8%;">区分</th>
                            <th style="width: 8%;">重要度</th>
                            <th style="width: 10%;">記入者</th>
                            <th style="width: 40%;">連絡事項</th>
                            <th style="width: 26%;">確認状況（12名）</th>
                        </tr>
                    </thead>
                    <tbody id="completed-log-table-body">
                        <!-- app.jsから描画 -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- タブ制御＆既存ロジック用スクリプト -->
    <script src="app.js?v=5"></script>
    <script>
        // タブ制御用 JavaScript
        function openTab(pageId, tabTitle) {
            const tabBar = document.getElementById('tab-bar');

            // 既にタブが存在するか確認
            let existingTab = document.getElementById(`tab-btn-${pageId}`);

            if (!existingTab) {
                // 新しいタブボタンを作成
                const newTab = document.createElement('button');
                newTab.className = 'tab-item';
                newTab.id = `tab-btn-${pageId}`;
                newTab.innerHTML = `${tabTitle} <span class="tab-close-btn" onclick="event.stopPropagation(); closeTab('${pageId}')">×</span>`;
                newTab.onclick = () => switchTab(pageId);
                tabBar.appendChild(newTab);
            }

            // 作成または既存のタブに切り替え
            switchTab(pageId);
        }

        function switchTab(pageId) {
            // すべてのページを非表示
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            // すべてのタブのactiveクラスを外す
            document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));

            // 該当ページとタブを表示状態にする
            const targetPage = document.getElementById(pageId);
            if (targetPage) targetPage.classList.add('active');

            const targetTab = document.getElementById(`tab-btn-${pageId}`) || document.querySelector('.tab-bar .tab-item:first-child');
            if (targetTab) targetTab.classList.add('active');
        }

        function closeTab(pageId) {
            const tabBtn = document.getElementById(`tab-btn-${pageId}`);
            if (tabBtn) tabBtn.remove();

            // 閉じたタブが開いていた場合、メインメニューに戻る
            const targetPage = document.getElementById(pageId);
            if (targetPage && targetPage.classList.contains('active')) {
                switchTab('main-page');
            }
        }
    </script>
</body>
</html>
