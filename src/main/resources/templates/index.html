<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臨床工学科 データベース</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #dee2e6;
            margin: 0;
            padding: 20px;
        }

        /* 1. コンテナの最大幅を広げる（または画面いっぱいにする） */
        .container {
            max-width: 98% !important; /* または 100% / 1400px などお好みのサイズに調整 */
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        /* 2. テーブル全体の幅を100%にして自動伸縮させる */
        .table-container {
            width: 100%;
            overflow-x: auto; /* 万が一横幅が収まりきらない場合にスクロール可能にする */
        }

        table {
            width: 100% !important;
            border-collapse: collapse;
        }

        /* 3. 各列（カラム）の幅を適切に配分する（任意） */
        th:nth-child(1), td:nth-child(1) {
            width: 100px;
        }
        /* 日付 */
        th:nth-child(2), td:nth-child(2) {
            width: 90px;
        }
        /* 区分 */
        th:nth-child(3), td:nth-child(3) {
            width: 80px;
        }
        /* 重要度 */
        th:nth-child(4), td:nth-child(4) {
            width: 90px;
        }
        /* 記入者 */
        th:nth-child(5), td:nth-child(5) {
            width: auto;
        }
        /* 内容（残り幅をすべて活用） */
        th:nth-child(6), td:nth-child(6) {
            width: 420px;
        }
        /* 確認チェック（12名分） */
        th:nth-child(7), td:nth-child(7) {
            width: 70px;
        }
        /* 操作（削除ボタン） */

        .page {
            display: none;
        }

            .page.active {
                display: block !important;
            }

        /* メインボタン群（3列配置） */
        .main-btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 32px 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.2s, transform 0.1s;
        }

            .btn:hover {
                background-color: #2980b9;
            }

            .btn:active {
                transform: scale(0.98);
            }

        .btn-back {
            background-color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .sub-btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 25px;
            margin-bottom: 30px;
        }

        .btn-sub {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px 10px;
            background-color: white;
            color: #2c3e50;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.2s, transform 0.1s;
        }

            .btn-sub:hover {
                background-color: #bdc3c7;
            }

            .btn-sub:active {
                transform: scale(0.98);
            }

        @media (max-width: 768px) {
            .main-btn-group {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .main-btn-group, .sub-btn-group {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .record-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
            background-color: #fff;
        }

            .record-table th, .record-table td {
                border: 1px solid #bdc3c7;
                padding: 12px;
                text-align: left;
                vertical-align: middle;
            }

            .record-table th {
                background-color: #e9ecef;
                font-weight: bold;
                color: #2c3e50;
            }

            .record-table tr:nth-child(even) {
                background-color: #f8f9fa;
            }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

            .btn-delete:hover {
                background-color: #c0392b;
            }

        .btn-edit {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-right: 5px;
        }

            .btn-edit:hover {
                background-color: #d35400;
            }

        /* 12名用チェックボックスグリッドスタイル */
        .staff-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px 8px;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .staff-checkbox-item {
            display: flex;
            align-items: center;
            font-size: 17px;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
            overflow: hidden;
            text-overflow: ellipsis;
        }

            .staff-checkbox-item input {
                width: auto;
                margin-right: 4px;
                cursor: pointer;
            }

            .staff-checkbox-item.checked {
                color: #27ae60;
                font-weight: bold;
            }

        /* 重要度バッジ */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-align: center;
        }

        .badge-high {
            background-color: #e74c3c;
        }

        .badge-med {
            background-color: #f39c12;
        }

        .badge-low {
            background-color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. メイン画面 -->
        <div id="main-page" class="page active">
            <h1 style="text-align: center; margin-bottom: 30px;">臨床工学科データベース</h1>

            <div class="main-btn-group">
                <button id="btn-to-worklog" type="button" class="btn">連絡事項</button>
                <button id="btn-to-equipment" type="button" class="btn">機器台帳</button>
                <button id="btn-to-trouble" type="button" class="btn">不具合対応</button>
                <button id="btn-to-purchase" type="button" class="btn">物品購入</button>
                <button id="btn-to-performance" type="button" class="btn">臨床実績</button>
                <button id="btn-to-duty" type="button" class="btn">宿日直</button>
                <button id="btn-to-lending" type="button" class="btn">貸出返却</button>
                <button id="btn-to-inspection" type="button" class="btn">点検実績</button>
            </div>

            <div class="sub-btn-group">
                <button id="btn-to-daily-report" type="button" class="btn-sub">新人日報</button>
                <button id="btn-to-annual-report" type="button" class="btn-sub">年報</button>
                <button id="btn-to-training" type="button" class="btn-sub">研修実績</button>
            </div>
        </div>

        <!-- 2. 連絡事項 一覧画面 -->
        <div id="worklog-page" class="page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div style="display: flex; gap: 10px;">
                    <button id="btn-to-form" type="button" class="btn" style="width: auto; margin: 0; padding: 12px 24px; font-size: 16px; background-color: #2ecc71;">＋ 新規登録</button>
                    <button id="btn-to-past-worklog" type="button" class="btn" style="width: auto; margin: 0; padding: 12px 24px; font-size: 16px; background-color: #7f8c8d;">📁 過去の連絡事項</button>
                </div>
                <button id="btn-back-main" type="button" class="btn btn-back" style="width: auto; margin: 0; padding: 12px 24px; font-size: 16px;">← メインに戻る</button>
            </div>

            <h2>連絡事項 一覧（未完了）</h2>

            <div style="overflow-x: auto; margin-bottom: 40px;">
                <table class="record-table">
                    <thead>
                        <tr>
                            <th style="width: 8%;">日付</th>
                            <th style="width: 5%;">区分</th>
                            <th style="width: 5%;">重要度</th>
                            <th style="width: 5%;">記入者</th>
                            <th style="width: 45%;">連絡事項</th>
                            <th style="width: 28%;">確認状況（12名）</th>
                            <th style="width: 8%;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body">
                        <!-- 自動描画 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 3. 連絡事項 入力画面 -->
        <div id="worklog-form-page" class="page">
            <div style="margin-bottom: 20px;">
                <button id="btn-back-worklog" type="button" class="btn btn-back" style="width: auto; margin: 0; padding: 12px 24px; font-size: 16px;">← 一覧に戻る</button>
            </div>

            <h2 id="form-title">連絡事項 新規登録</h2>

            <div style="background-color: #f8f9fa; padding: 30px; border-radius: 8px; border: 1px solid #dee2e6;">
                <form id="worklog-form">
                    <input type="hidden" id="log-id">

                    <!-- 日付・区分・重要度・記入者を横並びで配置 -->
                    <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 20px;">
                        <div class="form-group" style="margin-bottom: 0; width: 170px;">
                            <label for="log-date">日付</label>
                            <input type="date" id="log-date" required style="padding: 8px 10px;">
                        </div>
                        <div class="form-group" style="margin-bottom: 0; width: 130px;">
                            <label for="log-category">区分</label>
                            <select id="log-category" style="padding: 8px 10px;">
                                <option value="臨床">臨床</option>
                                <option value="会議">会議</option>
                                <option value="打合せ">打合せ</option>
                                <option value="学習会">学習会</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0; width: 120px;">
                            <label for="log-priority">重要度</label>
                            <select id="log-priority" style="padding: 8px 10px;">
                                <option value="通常">通常</option>
                                <option value="重要">重要</option>
                                <option value="緊急">緊急</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0; width: 160px;">
                            <label for="log-author">記入者</label>
                            <select id="log-author" style="padding: 8px 10px;">
                                <option value="">(選択なし)</option>
                                <!-- app.jsから自動でスタッフの選択肢が追加されます -->
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="log-details">連絡事項</label>
                        <textarea id="log-details" rows="6" placeholder="連絡事項の内容を入力してください" required></textarea>
                    </div>

                    <div style="display: flex; gap: 15px; margin-top: 25px;">
                        <button type="submit" class="btn" style="margin-top: 0; background-color: #2ecc71; width: auto; padding: 14px 32px; font-size: 18px;">保存する</button>
                        <button id="btn-cancel-form" type="button" class="btn" style="margin-top: 0; background-color: #95a5a6; width: auto; padding: 14px 32px; font-size: 18px;">キャンセル</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 4. 過去の連絡事項 専用画面 -->
        <div id="past-worklog-page" class="page">
            <div style="margin-bottom: 20px;">
                <button id="btn-back-worklog-from-past" type="button" class="btn btn-back" style="width: auto; margin: 0; padding: 12px 24px; font-size: 16px;">← 連絡事項一覧に戻る</button>
            </div>

            <h2>過去の連絡事項（全員確認済みアーカイブ）</h2>

            <div style="overflow-x: auto;">
                <table class="record-table">
                    <thead>
                        <tr style="background-color: #dcdde1;">
                            <th style="width: 8%;">日付</th>
                            <th style="width: 5%;">区分</th>
                            <th style="width: 5%;">重要度</th>
                            <th style="width: 5%;">記入者</th>
                            <th style="width: 45%;">連絡事項</th>
                            <th style="width: 28%;">確認状況（12名）</th>
                            <th style="width: 8%;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="completed-log-table-body">
                        <!-- 自動描画 -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- JavaScriptファイルの読み込み -->
    <script src="app.js?v=4"></script>
</body>
</html>
